# ─── Attribute Extraction Patterns ───────────────────────────────────────────
# Regex-based fallback for attribute extraction when LLM is unavailable.
# Each pattern maps to an evidence attribute from the closed registry.
attribute_patterns:
  people_trapped:
    patterns:
      - "(?i)\\b(trapped|stuck\\s+inside|cannot\\s+get\\s+out|pinned|people\\s+inside|locked\\s+in)\\b"
      - "(?i)\\b(rescue\\s+needed|need\\s+rescue)\\b"
    default_probability: 0.70

  casualties_reported:
    patterns:
      - "(?i)\\b(injur|casualt|hurt|wound|victim)\\b"
      - "(?i)\\b(\\d+)\\s*(people|persons?)\\s*(injured|hurt|wounded)\\b"
      - "(?i)\\b(bleeding|fracture|broken)\\b"
    default_probability: 0.65

  fatalities_reported:
    patterns:
      - "(?i)\\b(dead|death|died|killed|fatal|deceased|lifeless|body|bodies)\\b"
      - "(?i)\\b(no\\s+pulse|not\\s+breathing)\\b"
    default_probability: 0.60

  fire_active:
    patterns:
      - "(?i)\\b(fire|flames?|blaze|burning|ablaze|engulfed|inferno|aag)\\b"
      - "(?i)\\b(on\\s+fire|caught\\s+fire)\\b"
    default_probability: 0.75

  smoke_heavy:
    patterns:
      - "(?i)\\b(heavy\\s+smoke|thick\\s+smoke|black\\s+smoke|dense\\s+smoke|smoke\\s+everywhere)\\b"
      - "(?i)\\b(smoke\\s+billowing|smoke\\s+rising|choking\\s+smoke)\\b"
    default_probability: 0.70

  structural_damage:
    patterns:
      - "(?i)\\b(collapse|crumbl|damage|crack|tilt|lean|structur.*fail)\\b"
      - "(?i)\\b(wall.*(?:fell|down|crack)|roof.*(?:cave|collapse))\\b"
    default_probability: 0.65

  chemical_hazard:
    patterns:
      - "(?i)\\b(chemical|toxic|hazardous|hazmat|corrosive|acid|ammonia|chlorine)\\b"
      - "(?i)\\b(chemical\\s+(?:spill|leak|drum|tank))\\b"
    default_probability: 0.70

  gas_leak:
    patterns:
      - "(?i)\\b(gas\\s+leak|smell.*gas|lpg|gas\\s+cylinder|propane|methane)\\b"
      - "(?i)\\b(strong\\s+smell|hissing\\s+sound)\\b"
    default_probability: 0.70

  water_depth_high:
    patterns:
      - "(?i)\\b(water.*(?:waist|knee|chest|neck|above)|submerge|flood.*deep)\\b"
      - "(?i)\\b(water\\s*level.*(?:high|rising|dangerous))\\b"
    default_probability: 0.65

  road_blocked:
    patterns:
      - "(?i)\\b(road.*block|road.*close|street.*block|traffic.*stop|no.*passage)\\b"
      - "(?i)\\b(route.*block|path.*block|cannot.*pass)\\b"
    default_probability: 0.70

  power_down:
    patterns:
      - "(?i)\\b(power.*(?:out|cut|down|failure)|blackout|no\\s+electricity)\\b"
      - "(?i)\\b(light.*(?:gone|out)|transformer.*(?:blow|fail|down))\\b"
    default_probability: 0.70

  crowd_large:
    patterns:
      - "(?i)\\b(large\\s+crowd|huge\\s+crowd|thousands|hundreds\\s+of\\s+people|mob|gathering)\\b"
      - "(?i)\\b(overcrowd|packed|swarm)\\b"
    default_probability: 0.60

  spread_risk_high:
    patterns:
      - "(?i)\\b(spread|spreading|expanding|growing|intensif|escalat|getting\\s+worse)\\b"
      - "(?i)\\b(wind.*(?:strong|spreading)|fire.*spread)\\b"
    default_probability: 0.55

  access_restricted:
    patterns:
      - "(?i)\\b(access.*(?:block|restrict|difficult|impossible)|cannot.*reach|unreachable)\\b"
      - "(?i)\\b(narrow.*(?:lane|street)|no.*road.*access)\\b"
    default_probability: 0.65
