# PRAHARI AI Service — Keyword Rules for Incident Type Classification
# See README §16.4: deterministic fallback when LLM/classifier is unavailable.
#
# Each type maps to a list of keyword groups. If ANY group is fully matched
# (all keywords in the group appear in the text), the type is suggested.
# Groups are ordered by specificity — first match wins.
# Confidence is assigned based on match quality (exact phrase > individual words).

type_keywords:
  FIRE_STRUCTURE:
    keywords:
      - ["fire", "building"]
      - ["fire", "house"]
      - ["fire", "apartment"]
      - ["fire", "shop"]
      - ["fire", "office"]
      - ["fire", "floor"]
      - ["blaze", "building"]
      - ["flames", "structure"]
      - ["aag", "building"]         # Hindi: आग
      - ["aag", "ghar"]             # Hindi: आग घर
    single_keywords: ["fire", "blaze", "flames", "aag", "burning"]
    base_confidence: 0.65

  FIRE_INDUSTRIAL:
    keywords:
      - ["fire", "factory"]
      - ["fire", "industrial"]
      - ["fire", "chemical"]
      - ["fire", "warehouse"]
      - ["fire", "plant"]
      - ["explosion", "factory"]
      - ["blast", "industrial"]
